<!doctype html>
<html lang="ja">
<head><meta name="robots" content="noindex,nofollow">
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="豊橋市小畷町のEastGarage。持ち込みタイヤ交換、新品・中古タイヤ、ホイール販売のご相談。店舗直通 0532-35-9717。">
  <meta name="theme-color" content="#f5bf2c">
  <title>EastGarage 豊橋市小畷町のタイヤ・ホイール店</title>
  <link rel="stylesheet" href="assets/fonts/fonts.css">
  <link rel="stylesheet" href="assets/fonts/fonts-jp.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="welcome" aria-labelledby="welcome-title">
    <div class="tire-layer tire-layer--back" aria-hidden="true">
      <img class="tire" src="assets/parts/tire-contour.png" width="1254" height="1254" alt="" fetchpriority="high">
    </div>

    <header class="site-header">
      <span class="wordmark" lang="en">EastGarage</span>
      <nav class="header-links" aria-label="店舗案内">
        <a href="https://www.google.com/maps/search/?api=1&amp;query=EastGarage%20%E8%B1%8A%E6%A9%8B%E5%B8%82%E5%B0%8F%E7%95%B7%E7%94%BA396">地図を開く</a>
        <a class="reservation-link" href="https://www.goo-net.com/pit/booking/menu?client_id=0171919">グーネットで来店予約</a>
      </nav>
    </header>

    <div class="intro">
      <p class="location">豊橋市小畷町</p>
      <h1 id="welcome-title"><span>タイヤのこと、</span><span>持ち込みのこと。</span></h1>
      <ul class="services" aria-label="交換・販売">
        <li>持ち込みタイヤ交換</li>
        <li>新品・中古タイヤ</li>
        <li>ホイール販売</li>
      </ul>
    </div>

    <figure class="counter-photo">
      <img src="assets/photos/wood-counter.jpg" width="640" height="480" alt="木製の受付カウンターとOSBの壁" fetchpriority="high">
    </figure>

    <div class="tire-layer tire-layer--front" aria-hidden="true">
      <img class="tire" src="assets/parts/tire-contour.png" width="1254" height="1254" alt="">
    </div>

    <figure class="sign-photo">
      <img src="assets/photos/store-sign.jpg" width="640" height="480" alt="EastGarageの店名とタイヤのキャラクターが描かれた看板">
    </figure>

    <div class="contact">
      <a class="phone-link" href="tel:0532359717" aria-label="EastGarageへ電話する 0532-35-9717">
        <span class="phone-purpose">交換を相談する</span>
        <span class="phone-number">0532-35-9717</span>
      </a>
      <p class="hours"><span>10:00〜19:00</span><span>日曜定休</span></p>
      <p class="address">愛知県豊橋市小畷町396</p>
      <a class="mobile-reservation" href="https://www.goo-net.com/pit/booking/menu?client_id=0171919">グーネットで来店予約</a>
    </div>
  </main>
</body>
</html>
